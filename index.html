<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MemoAll</title>
<meta name="description" content="기능이 많은 마크다운 메모장 MemoAll">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MemoAll">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --text:#1f2328;--muted:#8b8f96;--line:#ececee;--hover:#f3f4f6;--side:#fafafa;
  --accent:#2563eb;--accent-soft:#eef3ff;
  --ui:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --doc-font:var(--ui);--code-font:Consolas,monospace;--fs:16px;--lh:1.8;--w:760px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);font-size:14px;background:#fff;color:var(--text);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#e2e3e7;border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* 사이드바 */
#sidebar{width:280px;min-width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:8px;padding:20px 18px 14px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.6px}
#count{margin-left:auto;font-size:12px;color:var(--muted)}
.side-top{padding:0 12px 8px;display:flex;flex-direction:column;gap:8px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border:none;border-radius:9px;background:var(--text);color:#fff;font-weight:600;padding:0 16px}
.btn-primary:hover{background:#000}
.btn-primary svg{width:16px;height:16px}
.btn-line{height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 14px;font-size:13px}
.btn-line:hover{background:var(--hover)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px 0 32px;outline:none}
.search input:focus{border-color:#cfd3da;box-shadow:0 0 0 3px #f1f2f4}
.seg{display:flex;background:#efeff1;border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.tagbar{display:flex;flex-wrap:wrap;gap:4px;max-height:78px;overflow:auto}
.tagbar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:12px;color:#5f6368}
.tagbar button i{font-style:normal;color:var(--muted);font-size:11px}
.tagbar button.on{background:var(--accent-soft);border-color:#c9d7fb;color:var(--accent)}
.sort-row{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.sort-row select{border:none;background:transparent;font-size:12px;color:var(--muted);outline:none;cursor:pointer}
.link-btn{border:none;background:none;color:#dc2626;font-size:12px;padding:0}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.item{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.item:hover{background:#f1f1f3}
.item.active{background:#fff;border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.it-title{display:flex;align-items:center;gap:6px;font-weight:600}
.it-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-title svg{width:13px;height:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.it-prev{font-size:13px;color:#6b7078;margin:3px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-meta{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-list{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}
.side-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:2px}
.side-foot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:transparent;border-radius:8px;padding:7px 4px;font-size:11.5px;color:#6b7078}
.side-foot button:hover{background:#efeff1;color:var(--text)}
.side-foot button.hl{color:var(--accent)}
.side-foot svg{width:16px;height:16px}

/* 툴바 */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:52px}
.ib{width:32px;height:32px;border:none;background:transparent;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#5f6368}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib.danger:hover{background:#fef2f2;color:#dc2626}
.fontbtn{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;max-width:180px;color:#3c4043}
.fontbtn:hover{background:var(--hover)}
.fontbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fontbtn svg{width:15px;height:15px}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.spacer{flex:1}
#toolbar .seg{padding:2px;margin:0 4px}
#toolbar .seg button{padding:4px 12px}
#menuBtn{display:none}
.dd{position:relative}
.menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:200px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);padding:6px;z-index:30}
.menu.right{left:auto;right:0}
.dd.open .menu{display:block}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:transparent;padding:7px 10px;border-radius:7px;font-size:13px;text-align:left;white-space:nowrap}
.menu button:hover{background:var(--hover)}
.menu button.sel::after{content:"✓";color:var(--accent);font-weight:700;font-family:var(--ui)}
.menu button kbd{font-family:var(--ui);font-size:11px;color:var(--muted)}
.mlabel{font-size:11px;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.mgroup{font-size:10.5px;color:#b0b4ba;padding:6px 10px 2px}
.mdiv{height:1px;background:var(--line);margin:5px 4px}
.fontmenu{width:250px}
.fontmenu button{font-size:15px}
.size-row{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.size-row button{width:36px;justify-content:center;padding:4px;font-size:16px}
.mseg{display:flex;gap:2px;background:#efeff1;border-radius:8px;padding:2px;margin:2px 6px 6px}
.mseg button{flex:1;justify-content:center;padding:5px 6px;font-size:12px;color:var(--muted)}
.mseg button:hover{background:transparent;color:var(--text)}
.mseg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}

/* 문서 */
#doc{flex:1;display:flex;flex-direction:column;min-height:0}
#head{width:100%;max-width:calc(var(--w) + 64px);margin:0 auto;padding:36px 32px 0}
#title{width:100%;border:none;outline:none;font-family:var(--doc-font);font-size:calc(var(--fs) * 1.85);font-weight:700;letter-spacing:-.5px;padding:0;background:transparent}
#title::placeholder,#editor::placeholder{color:#c4c7cc}
.meta-row{display:flex;align-items:center;gap:12px;margin-top:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tag-wrap{flex:1;display:flex;align-items:center;gap:6px;color:var(--muted)}
.tag-wrap svg{width:15px;height:15px}
#tags{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:#555}
.colors{display:flex;gap:7px}
.colors span{width:14px;height:14px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .1s}
.colors span:hover{transform:scale(1.2)}
.colors span.sel{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--text)}
.colors span.none{background:#fff linear-gradient(45deg,transparent 44%,#d0d3d8 44%,#d0d3d8 56%,transparent 56%)}
#workspace{flex:1;display:flex;min-height:0}
#editor,#preview{flex:1;min-width:0;height:100%;overflow:auto;padding:20px max(32px,calc((100% - var(--w)) / 2)) 160px;font-size:var(--fs);line-height:var(--lh)}
#editor{border:none;outline:none;resize:none;background:transparent;color:var(--text);tab-size:4}
#editor.nowrap{white-space:pre;overflow-x:auto}
#preview{display:none;font-family:var(--doc-font)}
.mode-split #preview,.mode-preview #preview{display:block}
.mode-preview #editor{display:none}
.mode-split #editor,.mode-split #preview{padding:20px 32px 160px}
.mode-split #preview{border-left:1px solid var(--line);background:#fcfcfd}
.md pre .copy-code{position:absolute;top:8px;right:8px;opacity:0;border:1px solid #e5e7eb;background:#fff;border-radius:6px;font-size:11px;padding:3px 8px;font-family:var(--ui);transition:.15s}
.md pre:hover .copy-code{opacity:1}
#preview input[data-task]{cursor:pointer}
#empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}

/* 상태바 */
#statusbar{display:flex;gap:16px;padding:0 16px;height:30px;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
#net.off{color:#dc2626;font-weight:600}
#status{margin-left:auto;display:flex;align-items:center;gap:6px}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e}
#status.typing::before{background:#f59e0b}
#status.err::before{background:#ef4444}

/* 찾기 */
#findbar{display:none;position:absolute;top:60px;right:16px;z-index:25;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:8px;width:400px;flex-direction:column;gap:6px}
#findbar.show{display:flex}
.frow{display:flex;gap:4px;align-items:center}
.frow input[type=text]{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;outline:none;font-size:13px}
.frow input[type=text]:focus{border-color:#cfd3da;box-shadow:0 0 0 3px #f1f2f4}
#findInfo{font-size:12px;color:var(--muted);min-width:46px;text-align:center}
.tbtn{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.fopt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:2px 4px}
.fopt input{accent-color:var(--accent)}

/* 모달 */
#modal{display:none;position:fixed;inset:0;background:rgba(15,17,20,.28);z-index:60;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.15)}
#modal.wide .mbox{width:min(1000px,94vw);height:84vh}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 22px;border-bottom:1px solid var(--line)}
.mhead b{font-size:16px}
.mbody{overflow:auto;padding:16px 22px;flex:1;min-height:0;line-height:1.7}
.mbody h4{margin:16px 0 6px;font-size:14px}
.mbody p{margin:6px 0;font-size:13.5px;color:#3c4043}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:#ecfdf3;color:#15803d}.pill.no{background:#fef2f2;color:#b91c1c}.pill.mid{background:#fffbeb;color:#b45309}
table.guide,table.keys{width:100%;border-collapse:collapse;font-size:13px}
table.guide th,table.keys th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.guide td,table.keys td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.guide td:first-child{font-weight:600;white-space:nowrap}
table.guide pre{margin:0;font-family:var(--code-font);font-size:12.5px;background:#f7f8fa;padding:8px 10px;border-radius:8px;white-space:pre-wrap}
table.guide .md{font-size:14px;line-height:1.6}
table.keys td:first-child{white-space:nowrap}
table.keys kbd{background:#f3f4f6;border:1px solid #e5e7eb;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px;font-family:var(--ui)}
.hist{display:flex;height:100%;gap:16px}
.hlist{width:210px;flex-shrink:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.hlist button{border:none;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.hlist button span{font-size:12px;color:var(--muted)}
.hlist button:hover{background:var(--hover)}
.hlist button.on{background:var(--accent-soft)}
.hview{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);padding-left:16px}
.hprev{flex:1;overflow:auto;font-family:var(--doc-font);font-size:15px}
.hact{padding-top:10px;display:flex;justify-content:flex-end}

body.focus #sidebar,body.focus #toolbar,body.focus #statusbar{display:none}
body.focus #head{padding-top:64px}
#toast{position:fixed;bottom:48px;left:50%;transform:translate(-50%,8px);background:#1f2328;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}
#printArea{position:absolute;left:-10000px;top:0;width:760px;font-family:var(--doc-font);font-size:var(--fs)}
.ptitle{font-size:2em;margin:0 0 .6em;letter-spacing:-.5px}
@media print{
  html,body{display:block;overflow:visible;height:auto;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;width:auto}
  @page{margin:18mm}
}
@media (max-width:820px){
  #sidebar{position:fixed;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.06)}
  body.side #sidebar{transform:none}
  #menuBtn{display:inline-flex}
  #head{padding:24px 20px 0}
  #editor,#preview{padding:16px 20px 120px}
  #findbar{left:12px;right:12px;width:auto}
  .hist{flex-direction:column}.hlist{width:auto;max-height:30%}.hview{border:none;padding:0}
  #storage,#cursorPos{display:none}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand"><b>MemoAll</b><span id="count"></span></div>
  <div class="side-top">
    <button class="btn-primary" id="newBtn" data-i="plus" title="새 메모 (Alt+N)">새 메모</button>
    <div class="search" data-i="search"><input type="search" id="search" placeholder="제목, 내용, 태그 검색"></div>
    <div class="seg" id="viewSeg">
      <button data-view="all" class="on">전체</button>
      <button data-view="pinned">고정</button>
      <button data-view="trash">휴지통</button>
    </div>
    <div class="tagbar" id="tagBar"></div>
    <div class="sort-row">
      <select id="sort">
        <option value="updated">최근 수정순</option>
        <option value="created">생성일순</option>
        <option value="title">제목순</option>
        <option value="length">긴 글순</option>
      </select>
      <button class="link-btn" id="emptyTrashBtn" style="display:none">휴지통 비우기</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="side-foot">
    <button id="backupBtn" data-i="save" title="모든 메모와 이미지를 파일로 백업">백업</button>
    <button id="restoreBtn" data-i="restore" title="백업 파일 불러오기">복원</button>
    <button id="openFileBtn" data-i="file" title=".md / .txt 파일 열기">파일 열기</button>
    <button id="installBtn" class="hl" data-i="install" title="앱으로 설치" style="display:none">앱 설치</button>
  </div>
</aside>

<main id="main">
  <div id="toolbar">
    <button class="ib" id="menuBtn" data-i="menu" title="메뉴"></button>
    <div class="dd">
      <button class="ib" data-i="heading" title="제목 크기 (Ctrl+Alt+0~6)"></button>
      <div class="menu">
        <button data-h="0">본문</button>
        <button data-h="1" style="font-size:20px;font-weight:700">제목 1</button>
        <button data-h="2" style="font-size:17px;font-weight:700">제목 2</button>
        <button data-h="3" style="font-size:15px;font-weight:700">제목 3</button>
        <button data-h="4" style="font-weight:700">제목 4</button>
        <button data-h="5" style="font-weight:600">제목 5</button>
        <button data-h="6" style="font-weight:600;color:#6b7078">제목 6</button>
      </div>
    </div>
    <button class="ib" data-i="bold" data-md="bold" title="굵게 (Ctrl+B)"></button>
    <button class="ib" data-i="italic" data-md="italic" title="기울임 (Ctrl+I)"></button>
    <button class="ib" data-i="strike" data-md="strike" title="취소선 (Ctrl+Shift+X)"></button>
    <button class="ib" data-i="mark" data-md="mark" title="형광펜 (Ctrl+Shift+H)"></button>
    <button class="ib" data-i="code" data-md="code" title="인라인 코드 (Ctrl+`)"></button>
    <span class="sep"></span>
    <button class="ib" data-i="ul" data-md="ul" title="글머리 목록"></button>
    <button class="ib" data-i="ol" data-md="ol" title="번호 목록"></button>
    <button class="ib" data-i="check" data-md="check" title="체크리스트"></button>
    <button class="ib" data-i="quote" data-md="quote" title="인용"></button>
    <span class="sep"></span>
    <button class="ib" data-i="link" data-md="link" title="링크 (Ctrl+K)"></button>
    <div class="dd">
      <button class="ib" data-i="image" title="이미지"></button>
      <div class="menu">
        <button data-img="file">파일에서 올리기</button>
        <button data-img="url">이미지 주소(URL)로 넣기</button>
        <div class="mdiv"></div>
        <div class="mlabel">Ctrl+V 붙여넣기, 끌어놓기도 돼요</div>
      </div>
    </div>
    <button class="ib" data-i="table" data-md="table" title="표"></button>
    <button class="ib" data-i="braces" data-md="codeblock" title="코드 블록"></button>
    <div class="dd">
      <button class="ib" data-i="insert" title="더 넣기"></button>
      <div class="menu">
        <div class="mlabel">수식 · 구조</div>
        <button data-ins="mathInline">인라인 수식 <kbd>$x$</kbd></button>
        <button data-ins="mathBlock">수식 블록 <kbd>$$</kbd></button>
        <button data-ins="mermaid">다이어그램 (Mermaid)</button>
        <button data-ins="footnote">각주</button>
        <button data-ins="toc">목차 [TOC]</button>
        <button data-ins="details">접기 / 펼치기</button>
        <button data-ins="hr">구분선</button>
        <div class="mdiv"></div>
        <div class="mlabel">기타 서식</div>
        <button data-ins="u">밑줄</button>
        <button data-ins="sup">위 첨자</button>
        <button data-ins="sub">아래 첨자</button>
        <button data-ins="kbd">키보드 키</button>
        <div class="mdiv"></div>
        <div class="mlabel">날짜 · 시간</div>
        <button data-ins="date">오늘 날짜</button>
        <button data-ins="time">현재 시각</button>
        <button data-ins="datetime">날짜와 시각</button>

/* ================= 라이브러리 (오프라인 캐시) ================= */
const CDN = {
  marked:'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js',
  purify:'https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js',

const CORE_LIBS = [CDN.marked, CDN.purify, CDN.hljs, CDN.katex, CDN.katexCss, CDN.hljsCss];

const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((ok, no) => {
    const r = indexedDB.open('memoall_cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('libs');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
  const run = async (mode, fn) => { const db = await open(); return new Promise((ok, no) => {
    const t = db.transaction('libs', mode), req = fn(t.objectStore('libs'));
    t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); }); };
  return {
    get: k => run('readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => null),
    keys: () => run('readonly', s => s.getAllKeys()).catch(() => []),
    clear: () => run('readwrite', s => s.clear()).catch(() => null)
  };
})();
const libText = {}, libUsed = {};
function getLib(url){
  return libText[url] ||= (async () => {
    let t = await idb.get(url); if (t) return t;
    try { const r = await fetch(url); if (r.ok){ t = await r.text(); await idb.set(url, t); return t; } } catch {}
    delete libText[url]; return null;
  })();
}
const absCss = (css, base) => css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, p) => /^(data:|https?:|blob:|\/\/)/.test(p) ? m : `url("${new URL(p, base).href}")`);
function useLib(url){
  return libUsed[url] ||= (async () => {
    const t = await getLib(url); if (!t){ delete libUsed[url]; return false; }
    if (url.endsWith('.css')){ const s=document.createElement('style'); s.textContent = absCss(t, url); document.head.appendChild(s); }
    else { const s=document.createElement('script'); s.textContent = t + '\n//# sourceURL=' + url; document.head.appendChild(s); }
    return true;
  })();
}

  let c=0; Object.keys(localStorage).forEach(k => { if(k.startsWith(K)) c += (localStorage.getItem(k)||'').length; });

function snapshot(n, force){

  if(!force && last && Date.now()-last.t < 5*60*1000) return;
  h.push({t:Date.now(), title:n.title, content:n.content});
  if(h.length > 20) h.splice(0, h.length-20);
}

const withImages = t => t.replace(/memoall:([a-z0-9]+)/g, (m,id) => images[id] || m);

function setupMarkdown(){
  HAS_MD = !!(window.marked && window.DOMPurify);
  if (!HAS_MD) return;
  renderer = new marked.Renderer();
  renderer.code = (code, lang) => {
    lang = (lang||'').trim().split(/\s/)[0];
    if (lang === 'mermaid') return `<div class="mermaid">${esc(code)}</div>`;
    let h = esc(code);
    if (window.hljs){ try { h = lang && hljs.getLanguage(lang) ? hljs.highlight(code,{language:lang}).value : hljs.highlightAuto(code).value; } catch{} }
    return `<pre><code class="hljs${lang?' language-'+esc(lang):''}">${h}</code></pre>`;
  };
}
function renderMarkdown(src){
  if (!HAS_MD) return '<pre style="white-space:pre-wrap;font-family:inherit">'+esc(src)+'</pre>';
  src = withImages(src);
  const codes=[], maths=[], notesFn={}, order=[];
  src = src.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`/g, m => { codes.push(m); return '\uE000'+(codes.length-1)+'\uE001'; });
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m,c) => { maths.push([c,true]); return '\n\n\uE002'+(maths.length-1)+'\uE003\n\n'; })
           .replace(/\\\$/g,'\uE004')
           .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (m,c) => { maths.push([c,false]); return '\uE002'+(maths.length-1)+'\uE003'; })
           .replace(/\uE004/g,'\\$');
  src = src.replace(/^\[\^([^\]]+)\]:[ \t]*(.+)$/gm, (m,k,t) => { notesFn[k]=t; return ''; });
  src = src.replace(/\[\^([^\]]+)\]/g, (m,k) => { if(!(k in notesFn)) return m; if(!order.includes(k)) order.push(k); const i=order.indexOf(k)+1; return `<sup class="fn"><a href="#fn-${i}" id="fnref-${i}">[${i}]</a></sup>`; });
  src = src.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  src = src.replace(/^\[TOC\]$/gim, '<div class="toc-ph"></div>');
  src = src.replace(/\uE000(\d+)\uE001/g, (m,i) => codes[i]);
  let html = marked.parse(src, {gfm:true, breaks:settings.breaks, renderer});
  if (order.length) html += '<section class="footnotes"><ol>' + order.map((k,i) => `<li id="fn-${i+1}">${marked.parseInline(notesFn[k])} <a href="#fnref-${i+1}">↩</a></li>`).join('') + '</ol></section>';
  html = DOMPurify.sanitize(html, {ADD_ATTR:['target']});
  return html.replace(/\uE002(\d+)\uE003/g, (m,i) => {
    const [c,d] = maths[i];
    if (!window.katex) return esc(d?'$$'+c+'$$':'$'+c+'$');
    try { return katex.renderToString(c, {displayMode:d, throwOnError:false}); } catch { return esc(c); }
  });
}
function postProcess(el, interactive){
  const hs=[...el.querySelectorAll('h1,h2,h3,h4,h5,h6')], used={};
  hs.forEach(h => { let id=h.textContent.trim().toLowerCase().replace(/[^\w가-힣]+/g,'-').replace(/^-|-$/g,'')||'section'; if(used[id]) id+='-'+(used[id]++); else used[id]=1; h.id=id; });
  el.querySelectorAll('.toc-ph').forEach(t => {
    const min = Math.min(...hs.map(h=>+h.tagName[1]), 6);
    t.outerHTML = '<nav class="toc"><b>목차</b><ul>' + hs.map(h => `<li style="padding-left:${(h.tagName[1]-min)*1.1}em"><a href="#${h.id}">${esc(h.textContent)}</a></li>`).join('') + '</ul></nav>';
  });
  el.querySelectorAll('a[href^="http"]').forEach(a => { a.target='_blank'; a.rel='noopener'; });
  if (interactive){
    el.querySelectorAll('li>input[type=checkbox]').forEach((c,i) => { c.disabled = ed.readOnly; c.dataset.task = i; });
    el.querySelectorAll('pre').forEach(p => p.insertAdjacentHTML('beforeend','<button class="copy-code">복사</button>'));

  const mm = [...el.querySelectorAll('.mermaid')];
  if (mm.length) return useLib(CDN.mermaid).then(ok => {
    if (!ok || !window.mermaid) return;
    mermaid.initialize({startOnLoad:false, theme:'neutral'}); return mermaid.run({nodes:mm});
  }).catch(()=>{});
  return Promise.resolve();
}

function wrapSel(before, after=before, ph='텍스트'){

const visLen = s => [...s].reduce((a,c)=>a+(/[\u1100-\uFFDC]/.test(c)?2:1),0);
const textTools = {
  upper:t=>t.toUpperCase(), lower:t=>t.toLowerCase(), title:t=>t.replace(/\b\w/g,c=>c.toUpperCase()),
  sort:t=>t.split('\n').sort((a,b)=>a.localeCompare(b,'ko')).join('\n'),
  sortr:t=>t.split('\n').sort((a,b)=>b.localeCompare(a,'ko')).join('\n'),
  reverse:t=>t.split('\n').reverse().join('\n'),
  dedupe:t=>[...new Set(t.split('\n'))].join('\n'),
  trim:t=>t.split('\n').map(l=>l.trim()).join('\n'),
  blank:t=>t.split('\n').filter(l=>l.trim()).join('\n'),
  join:t=>t.split('\n').map(l=>l.trim()).filter(Boolean).join(' '),
  number:t=>t.split('\n').map((l,i)=>`${i+1}. ${l}`).join('\n'),
  shuffle:t=>{ const a=t.split('\n'); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.join('\n'); },
  table:t=>t.replace(/(^\s*\|.*\|\s*$\n?)+/gm, blk => {
    const rows=blk.trimEnd().split('\n').map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    const w=[]; rows.forEach(r=>r.forEach((c,i)=>{ if(!/^:?-+:?$/.test(c)) w[i]=Math.max(w[i]||3, visLen(c)); }));
    return rows.map(r=>'| '+w.map((x,i)=>{ const c=r[i]||''; return /^:?-+:?$/.test(c) ? '-'.repeat(x) : c+' '.repeat(x-visLen(c)); }).join(' | ')+' |').join('\n')+'\n';
  })
};

/* ================= 이미지 ================= */
function shrink(f){
  return new Promise(res => {
    const r=new FileReader();
    r.onload = () => {
      if (/gif|svg/.test(f.type)) return res(r.result);
      const img=new Image();
      img.onload = () => { const s=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg', .85)); };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
async function addImages(files){
  if (!cur() || ed.readOnly) return toast('메모를 먼저 열어 주세요');
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const id=uid(); images[id]=await shrink(f);
    if (!saveImages()){ delete images[id]; return toast('저장 공간이 부족해 이미지를 넣지 못했어요'); }
    insertText(`![${f.name.replace(/\.[^.]+$/,'')||'이미지'}](memoall:${id})\n`);
  }
}

/* ================= 찾기 / 바꾸기 ================= */
function getRe(){
  const q=$('#findInput').value; if(!q) return null;
  try { return new RegExp($('#reChk').checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'+($('#caseChk').checked?'':'i')); } catch { return null; }
}
function findAll(){
  const re=getRe(); if(!re) return []; const r=[]; let m;
  while ((m=re.exec(ed.value))){ if(!m[0].length){ re.lastIndex++; continue; } r.push([m.index, m[0].length]); }
  return r;
}
function find(dir=1){
  const hits=findAll();
  if (!hits.length){ $('#findInfo').textContent = $('#findInput').value ? '없음' : ''; return; }
  let idx = dir>0 ? hits.findIndex(h=>h[0]>=ed.selectionEnd) : hits.map(h=>h[0]<ed.selectionStart).lastIndexOf(true);
  if (idx<0) idx = dir>0 ? 0 : hits.length-1;
  ed.focus(); ed.setSelectionRange(hits[idx][0], hits[idx][0]+hits[idx][1]);
  ed.scrollTop = (ed.value.slice(0,hits[idx][0]).split('\n').length-4) * parseFloat(getComputedStyle(ed).lineHeight);
  $('#findInfo').textContent = `${idx+1}/${hits.length}`;
}
function replaceOne(){
  const re=getRe(); if(!re) return;
  const s=ed.selectionStart, e=ed.selectionEnd, hit=findAll().find(h=>h[0]===s && h[0]+h[1]===e);
  if (hit){ const one=new RegExp(re.source, re.flags.replace('g','')), rep=$('#replaceInput').value;
    insertText(ed.value.slice(s,e).replace(one, $('#reChk').checked ? rep : ()=>rep)); }
  find(1);
}
function replaceAll(){
  const re=getRe(); if(!re) return toast('찾을 내용을 입력하세요');

function makeIcon(size, maskable){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
  x.fillStyle='#1f2328';
  if (maskable) x.fillRect(0,0,size,size);
  else { const r=size*.22; x.beginPath(); x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); x.fill(); }
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  const fs = size * (maskable ? .17 : .21);
  x.font = `800 ${fs}px Pretendard, system-ui, sans-serif`;
  x.fillText('Memo', size/2, size/2 - fs*.55); x.fillText('All', size/2, size/2 + fs*.6);
  return c.toDataURL('image/png');
}

function handleFile(f, mode){
  if (!f) return; const r=new FileReader();
  r.onload = () => {
    if (mode==='backup'){
      try {
        const d=JSON.parse(r.result), arr=Array.isArray(d)?d:d.notes; if(!Array.isArray(arr)) throw 0;
        if (d.images) Object.assign(images, d.images); saveImages();
        const ids=new Set(notes.map(n=>n.id)); let added=0;
        arr.forEach(n => { if(n.id && !ids.has(n.id)){ notes.push(Object.assign({title:'',content:'',tags:[],color:'',pinned:false,deleted:false,history:[],created:Date.now(),updated:Date.now()}, n)); added++; } });
        save(); renderList(); toast(`${added}개 메모를 복원했습니다`);
      } catch { alert('올바른 MemoAll 백업 파일이 아닙니다.'); }
    } else {
      let text=r.result, title=f.name.replace(/\.[^.]+$/,'');
      const m=text.match(/^# (.+)\n+/); if(m){ title=m[1]; text=text.slice(m[0].length); }
      newNote(text, title);
    }
  };
  r.readAsText(f);
}

/* ================= 이벤트 ================= */
function closeMenus(){ $$('.dd.open').forEach(d=>d.classList.remove('open')); }

$$('.dd > button').forEach(b => b.onclick = e => {
  e.stopPropagation(); const d=b.parentElement, was=d.classList.contains('open'); closeMenus();
  if (!was){ d.classList.add('open'); if(d.querySelector('#fontMenu')) loadAllFonts(); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.menu') || (e.target.closest('.menu button') && !e.target.closest('#viewMenu'))) closeMenus();
});

$('#newBtn').onclick = () => newNote();
$('#search').oninput = renderList;
$('#sort').onchange = e => { settings.sort=e.target.value; saveSettings(); renderList(); };

$$('#viewSeg button').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#tagBar').onclick = e => { const b=e.target.closest('[data-tag]'); if(!b) return; tagFilter = tagFilter===b.dataset.tag ? null : b.dataset.tag; renderList(); };
$('#list').onclick = e => { const it=e.target.closest('.item'); if(it) openNote(it.dataset.id); };
$('#title').oninput = e => { const n=cur(); if(n){ n.title=e.target.value; touch(); } };
$('#title').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); ed.focus(); } };
$('#tags').oninput = e => { const n=cur(); if(n){ n.tags=[...new Set(e.target.value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean))]; touch(); } };
$('#tags').onblur = () => renderList();
$('#colors').onclick = e => { const c=e.target.dataset.c, n=cur(); if(c!==undefined && n && !n.deleted){ n.color=c; touch(); renderColors(); renderList(); } };

ed.addEventListener('input', onEdit);
['keyup','click','select'].forEach(ev => ed.addEventListener(ev, updateStats));
ed.addEventListener('paste', e => { const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')); if(fs.length){ e.preventDefault(); addImages(fs); } });
ed.addEventListener('keydown', e => {
  if (e.key==='Tab'){
    e.preventDefault();
    if (ed.selectionStart!==ed.selectionEnd || e.shiftKey){ const [s,en]=lineRange(); ed.setSelectionRange(s,en);
      insertText(ed.value.slice(s,en).split('\n').map(l=>e.shiftKey?l.replace(/^( {1,4}|\t)/,''):'    '+l).join('\n')); }
    else insertText('    ');
  }
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing){
    const s=ed.selectionStart, ls=ed.value.lastIndexOf('\n',s-1)+1, line=ed.value.slice(ls,s);
    const m=line.match(/^(\s*)([-*+] \[[ x]\] |[-*+] |(\d+)\. |> )(.*)$/i);
    if (m){
      e.preventDefault();
      if (!m[4].trim()){ ed.setSelectionRange(ls,s); insertText(''); return; }
      let p=m[2]; if(m[3]) p=(+m[3]+1)+'. '; p=p.replace(/\[x\]/i,'[ ]');
      insertText('\n'+m[1]+p);
    }
  }
});
ed.addEventListener('scroll', () => { if(settings.mode==='split'){ const p=$('#preview'); p.scrollTop=(ed.scrollTop/((ed.scrollHeight-ed.clientHeight)||1))*(p.scrollHeight-p.clientHeight); } });

$('#preview').addEventListener('click', e => {
  const t=e.target;
  if (t.dataset.task !== undefined && !ed.readOnly){
    const idx=+t.dataset.task; let i=0;
    const v=ed.value.replace(/^(\s*(?:[-*+]|\d+\.)\s+\[)([ xX])(\])/gm, (m,a,b,c) => i++===idx ? a+(b===' '?'x':' ')+c : m);
    ed.focus(); ed.select(); insertText(v); return;
  }
  if (t.classList.contains('copy-code')){ copyText(t.parentElement.querySelector('code')?.innerText||''); t.textContent='복사됨'; setTimeout(()=>t.textContent='복사',1200); return; }
  const a=t.closest('a[href^="#"]');
  if (a){ e.preventDefault(); const id=decodeURIComponent(a.getAttribute('href').slice(1)); $('#preview').querySelector('#'+CSS.escape(id))?.scrollIntoView({behavior:'smooth', block:'start'}); }
});


$$('[data-md]').forEach(b => b.onclick = () => mdActions[b.dataset.md]());

$$('.menu [data-h]').forEach(b => b.onclick = () => { closeMenus(); setHeading(+b.dataset.h); });

$$('[data-ins]').forEach(b => b.onclick = () => { closeMenus(); insActions[b.dataset.ins](); });

$$('[data-img]').forEach(b => b.onclick = () => {
  closeMenus();
  if (b.dataset.img==='file') $('#imgInput').click();
  else { const u=prompt('이미지 주소(URL)','https://'); if(u && u!=='https://') insertText(`![이미지](${u})\n`); }
});
$('#imgInput').onchange = e => { addImages([...e.target.files]); e.target.value=''; };

$$('[data-tool]').forEach(b => b.onclick = () => {
  closeMenus(); if(ed.readOnly || !cur()) return;
  if (ed.selectionStart===ed.selectionEnd) ed.select();
  const s=ed.selectionStart, sel=ed.value.slice(s, ed.selectionEnd);
  if (b.dataset.tool==='sum'){
    const nums=(sel.match(/-?\d[\d,]*\.?\d*/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>!isNaN(x));
    const sum=nums.reduce((a,c)=>a+c,0);
    return toast(nums.length ? `숫자 ${nums.length}개 · 합계 ${sum.toLocaleString()} · 평균 ${(sum/nums.length).toLocaleString(undefined,{maximumFractionDigits:2})}` : '숫자가 없습니다');
  }
  const r=textTools[b.dataset.tool](sel); insertText(r); ed.setSelectionRange(s, s+r.length); toast(b.textContent+' 완료');
});

$('#findBtn').onclick = () => toggleFind(!$('#findbar').classList.contains('show'));
$('#findClose').onclick = () => toggleFind(false);
$('#findNext').onclick = () => find(1); $('#findPrev').onclick = () => find(-1);
$('#findInput').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); find(e.shiftKey?-1:1); } };
['#findInput','#caseChk','#reChk'].forEach(s => $(s).addEventListener('input', () => { const h=findAll(); $('#findInfo').textContent = $('#findInput').value ? (h.length?`${h.length}개`:'없음') : ''; }));
$('#replaceOne').onclick = replaceOne; $('#replaceAll').onclick = replaceAll;


$$('#modeSeg button').forEach(b => b.onclick = () => { settings.mode=b.dataset.mode; applySettings(); });
$('#sizeDown').onclick = () => { settings.size=Math.max(11, settings.size-1); applySettings(); };
$('#sizeUp').onclick = () => { settings.size=Math.min(36, settings.size+1); applySettings(); };

$$('[data-set] button').forEach(b => b.onclick = () => { settings[b.parentElement.dataset.set]=+b.dataset.val; applySettings(); });

$$('[data-toggle]').forEach(b => b.onclick = () => { const k=b.dataset.toggle; settings[k]=!settings[k]; applySettings(); });

$$('[data-export]').forEach(b => b.onclick = () => { closeMenus(); doExport(b.dataset.export); });

$$('[data-more]').forEach(b => b.onclick = () => { closeMenus(); doMore(b.dataset.more); });
$('#menuBtn').onclick = e => { e.stopPropagation(); document.body.classList.toggle('side'); };
$('#installBtn').onclick = installApp;

$('#pinBtn').onclick = () => { const n=cur(); if(!n||n.deleted) return; n.pinned=!n.pinned; $('#pinBtn').classList.toggle('on',n.pinned); touch(); renderList(); toast(n.pinned?'고정했습니다':'고정을 해제했습니다'); };
$('#dupBtn').onclick = () => { const n=cur(); if(!n) return; const c={...n, id:uid(), title:(n.title||'제목 없음')+' 사본', created:Date.now(), updated:Date.now(), tags:[...n.tags], history:[], deleted:false, pinned:false}; notes.unshift(c); setView('all'); openNote(c.id); save(); toast('복제했습니다'); };
$('#delBtn').onclick = () => {
  const n=cur(); if(!n) return;
  if (n.deleted){ if(!confirm('이 메모를 영구 삭제할까요? 되돌릴 수 없습니다.')) return; notes=notes.filter(x=>x.id!==n.id); gcImages(); toast('영구 삭제했습니다'); }
  else { n.deleted=true; n.pinned=false; toast('휴지통으로 이동했습니다'); }
  save(); openNote(null);
};
$('#restoreNoteBtn').onclick = () => { const n=cur(); if(n){ n.deleted=false; save(); setView('all'); openNote(n.id); toast('복원했습니다'); } };
$('#emptyTrashBtn').onclick = () => { if(confirm('휴지통을 비울까요? 되돌릴 수 없습니다.')){ notes=notes.filter(n=>!n.deleted); gcImages(); save(); openNote(null); } };

$('#backupBtn').onclick = () => { download(`MemoAll_백업_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:'MemoAll', version:4, notes, images}), 'application/json'); toast('백업 파일을 저장했습니다'); };
$('#restoreBtn').onclick = () => { fileMode='backup'; $('#fileInput').click(); };
$('#openFileBtn').onclick = () => { fileMode='text'; $('#fileInput').click(); };
$('#fileInput').onchange = e => { handleFile(e.target.files[0], fileMode); e.target.value=''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); const fs=[...e.dataTransfer.files]; if(!fs.length) return;
  const imgs=fs.filter(f=>f.type.startsWith('image/')); if(imgs.length) return addImages(imgs);
  handleFile(fs[0], fs[0].name.endsWith('.json') ? 'backup' : 'text');
});

document.addEventListener('keydown', e => {
  const c=e.ctrlKey||e.metaKey, k=e.key.toLowerCase(), inEd=document.activeElement===ed;
  if (c && e.shiftKey && k==='s'){ e.preventDefault(); doExport('savefile'); }
  else if (c && k==='s'){ e.preventDefault(); snapshot(cur(), true); save(); toast('저장했습니다'); }
  else if (c && e.shiftKey && k==='f'){ e.preventDefault(); doMore('focus'); }
  else if (c && e.shiftKey && k==='h' && inEd){ e.preventDefault(); mdActions.mark(); }
  else if (c && e.shiftKey && k==='x' && inEd){ e.preventDefault(); mdActions.strike(); }
  else if (c && e.altKey && /^[0-6]$/.test(e.key) && inEd){ e.preventDefault(); setHeading(+e.key); }
  else if (c && (k==='f' || k==='h')){ e.preventDefault(); toggleFind(true); if(k==='h') $('#replaceInput').focus(); }
  else if (c && k==='b' && inEd){ e.preventDefault(); mdActions.bold(); }
  else if (c && k==='i' && inEd){ e.preventDefault(); mdActions.italic(); }
  else if (c && k==='k' && inEd){ e.preventDefault(); mdActions.link(); }
  else if (c && e.key==='`' && inEd){ e.preventDefault(); mdActions.code(); }
  else if (c && k==='e'){ e.preventDefault(); settings.mode={edit:'split',split:'preview',preview:'edit'}[settings.mode]; applySettings(); }
  else if (c && k==='p'){ e.preventDefault(); doExport('print'); }
  else if (c && k==='/'){ e.preventDefault(); doMore('keys'); }
  else if (e.altKey && k==='n'){ e.preventDefault(); newNote(); }
  else if (e.key==='Escape'){ hideModal(); toggleFind(false); closeMenus(); document.body.classList.remove('focus','side'); }
});
window.addEventListener('beforeunload', () => { snapshot(cur()); save(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden'){ snapshot(cur()); save(); } });

/* ================= 시작 ================= */
buildFontMenu();
applySettings();
if (!notes.length){ newNote(SAMPLE, 'MemoAll 시작하기'); settings.mode='split'; applySettings(); }
else openNote(cur() && !cur().deleted ? currentId : (notes.find(n=>!n.deleted)?.id || null));
if (new URLSearchParams(location.search).has('new')){ newNote(); history.replaceState(null, '', location.pathname); }
save(); updateNet();
bootLibs();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(setupPWA);
navigator.storage?.persist?.().catch(()=>{});
</script>
</body>
</html>
